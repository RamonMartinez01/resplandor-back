services:
  # El backend del Portfolio CMS
  app-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "127.0.0.1:8081:5000"
    env_file:
      - .env
    depends_on:
      db-portfolio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - portfolio-network

  # La nueva base de datos limpia
  db-portfolio:
    image: postgres:15-alpine
    container_name: portfolio-db
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=portfolio_db
    volumes:
      - portfolio_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  portfolio-network:
    driver: bridge

volumes:
  portfolio_data: